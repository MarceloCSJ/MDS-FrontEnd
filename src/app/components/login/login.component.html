<header>
  <div class="header-geral">
      <h2>Meu Diário</h2>
      <h2>SENAC</h2>
  </div>
</header>

<div id="login-container">
        <section id="login">
            <div id="login-header">
                <h2>Login</h2>
                <button id="login-fechar">X</button>
            </div>
            <form id="login-form" (ngSubmit)="autenticar()">
                <label for="nome">Digite o seu nome:</label>
                <input type="text" id="nome" name="nome" [(ngModel)]="nome">

                <label for="senha">Digite sua senha:</label>
                <input type="password" id="senha" name="senha" [(ngModel)]="senha">

                <button type="submit">Entrar</button>
            </form>
        </section>
    </div>
