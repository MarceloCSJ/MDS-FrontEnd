<header>
    <div class="header-geral">
        <h2>Meu Diário</h2>
        <h2>SENAC</h2>
    </div>
    <div class="header-geral">
        <p>Registre seus pensamentos</p>
        <p>e anotações</p>
    </div>
    <div id="header-avatar">
        <button id="avatar-clicavel"></button>
        <div id="avatar-nome">
            <h3>Nome do Usuário</h3>
            <a href="javascript:void(0)">Editar Perfil</a>
        </div>
    </div>
</header>
<main> 
    <h2 id="titulo">Registros</h2>
        <!--                                 registroOrigem       -->
    <div id="registros-container" *ngFor="let registro of registros">
        <!--           registroDestino = registroOrigem -->
        <app-card-registros [registro] = "registro"></app-card-registros>
    </div>
    <button id="adicionar-registro" (click)="modalSolicitado = true">
        <span>+</span>
    </button>
</main>

@if (modalSolicitado) {
    <div id="modal-container">
        <section id="modal">
            <div id="modal-header">
                <h2>Adicionar Registro</h2>
                <button id="modal-fechar" (click)="modalSolicitado = false">X</button>
            </div>
            <form id="modal-form">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>

                <label for="conteudo">Conteúdo:</label>
                <textarea id="conteudo" name="conteudo" required></textarea>

                <button type="submit">Salvar</button>
            </form>
        </section>
    </div>
}
