<header>
    <div class="header-geral">
        <h2>Meu Diário</h2>
        <h2>SENAC</h2>
    </div>
    <div class="header-geral">
        <p>Registre seus pensamentos</p>
        <p>e anotações</p>
    </div>
    <div id="header-avatar">
        <button id="avatar-clicavel"></button>
        <div id="avatar-nome">
            <h3>Nome do Usuário</h3>
            <a href="javascript:void(0)">Editar Perfil</a>
        </div>
    </div>
</header>
<main> 
    <h2 id="titulo">Registros</h2>
        <!--                                 registroOrigem       -->
    <div id="registros-container" *ngFor="let registro of registros">
        <!--           registroDestino = registroOrigem -->
        <app-card-registros [registro] = "registro"></app-card-registros>
    </div>
    <button id="adicionar-registro">
        <span>+</span>
    </button>
</main>
